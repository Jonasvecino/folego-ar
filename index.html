<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
    }
  </style>
</head>

<body>

<a-scene
  mindar-image="imageTargetSrc: ./targets%202.mind;"
  color-space="sRGB"
  renderer="colorManagement: true"
  vr-mode-ui="enabled: false"
  device-orientation-permission-ui="enabled: false">

  <a-assets>
    <img id="fragEsq" src="./fragmentos-esq.png">
    <img id="fragDir" src="./fragmentos-dir.png">
  </a-assets>

  <a-camera
    position="0 0 0"
    look-controls="enabled: false">
  </a-camera>

  <a-entity mindar-image-target="targetIndex: 0">

    <a-image
      src="#fragEsq"
      width="1.38"
      height="1.84"
      position="-0.02 0 0.05"
      rotation="-4 8 -2"
      material="transparent: true; opacity: 0.78; alphaTest: 0.01"
      animation__pos="
        property: position;
        from: -0.02 0 0.05;
        to: -0.08 0.07 0.16;
        dir: alternate;
        dur: 3600;
        loop: true;
        easing: easeInOutSine"
      animation__rot="
        property: rotation;
        from: -4 8 -2;
        to: 5 18 3;
        dir: alternate;
        dur: 4700;
        loop: true;
        easing: easeInOutSine">
    </a-image>

    <a-image
      src="#fragDir"
      width="1.38"
      height="1.84"
      position="0.02 0 0.08"
      rotation="3 -10 2"
      material="transparent: true; opacity: 0.74; alphaTest: 0.01"
      animation__pos="
        property: position;
        from: 0.02 0 0.08;
        to: 0.09 0.08 0.22;
        dir: alternate;
        dur: 4200;
        loop: true;
        easing: easeInOutSine"
      animation__rot="
        property: rotation;
        from: 3 -10 2;
        to: -5 -20 -3;
        dir: alternate;
        dur: 5200;
        loop: true;
        easing: easeInOutSine">
    </a-image>

  </a-entity>

</a-scene>

</body>
</html>
