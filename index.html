<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
    }
  </style>
</head>

<body>

<a-scene
  mindar-image="imageTargetSrc: ./targets%202.mind;"
  color-space="sRGB"
  renderer="colorManagement: true"
  vr-mode-ui="enabled: false"
  device-orientation-permission-ui="enabled: false">

  <a-assets>
    <img id="fragEsq" src="./fragmentos-esq.png">
    <img id="fragDir" src="./fragmentos-dir.png">
  </a-assets>

  <a-camera
    position="0 0 0"
    look-controls="enabled: false">
  </a-camera>

  <a-entity mindar-image-target="targetIndex: 0">

    <!-- camada esquerda, mais perto do quadro -->
    <a-image
      src="#fragEsq"
      width="1.38"
      height="1.84"
      position="0 0 0.035"
      rotation="0 0 0"
      scale="1 1 1"
      material="transparent: true; opacity: 0.76; alphaTest: 0.01"
      animation__fade="
        property: material.opacity;
        from: 0.72;
        to: 0.80;
        dir: alternate;
        dur: 2800;
        loop: true;
        easing: easeInOutSine"
      animation__scale="
        property: scale;
        from: 1 1 1;
        to: 1.01 1.01 1;
        dir: alternate;
        dur: 3200;
        loop: true;
        easing: easeInOutSine">
    </a-image>

    <!-- camada direita, um pouco mais à frente -->
    <a-image
      src="#fragDir"
      width="1.38"
      height="1.84"
      position="0 0 0.07"
      rotation="0 0 0"
      scale="1 1 1"
      material="transparent: true; opacity: 0.70; alphaTest: 0.01"
      animation__fade="
        property: material.opacity;
        from: 0.66;
        to: 0.75;
        dir: alternate;
        dur: 3400;
        loop: true;
        easing: easeInOutSine"
      animation__scale="
        property: scale;
        from: 1 1 1;
        to: 1.015 1.015 1;
        dir: alternate;
        dur: 3600;
        loop: true;
        easing: easeInOutSine">
    </a-image>

  </a-entity>

</a-scene>

</body>
</html>
