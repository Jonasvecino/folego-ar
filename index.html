<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
    }
  </style>
</head>

<body>

<a-scene
  mindar-image="imageTargetSrc: ./targets%202.mind;"
  color-space="sRGB"
  renderer="colorManagement: true"
  vr-mode-ui="enabled: false"
  device-orientation-permission-ui="enabled: false">

  <a-assets>
    <img id="fragEsq" src="./fragmentos-esq.png">
    <img id="fragDir" src="./fragmentos-dir.png">
  </a-assets>

  <a-camera
    position="0 0 0"
    look-controls="enabled: false">
  </a-camera>

  <a-entity mindar-image-target="targetIndex: 0">

    <!-- ESQUERDA: camada junto ao corpo -->
    <a-image
      src="#fragEsq"
      width="1.55"
      height="2.05"
      position="-0.03 0.00 0.03"
      rotation="0 0 0"
      material="transparent: true; opacity: 0.82; alphaTest: 0.01">
    </a-image>

    <!-- ESQUERDA: camada intermédia -->
    <a-image
      src="#fragEsq"
      width="1.25"
      height="1.68"
      position="-0.20 0.06 0.12"
      rotation="4 10 -4"
      material="transparent: true; opacity: 0.68; alphaTest: 0.01">
    </a-image>

    <!-- ESQUERDA: camada mais afastada -->
    <a-image
      src="#fragEsq"
      width="0.92"
      height="1.24"
      position="-0.38 0.12 0.24"
      rotation="8 18 -8"
      material="transparent: true; opacity: 0.52; alphaTest: 0.01">
    </a-image>


    <!-- DIREITA: camada junto ao corpo -->
    <a-image
      src="#fragDir"
      width="1.50"
      height="2.00"
      position="0.03 0.00 0.05"
      rotation="0 0 0"
      material="transparent: true; opacity: 0.80; alphaTest: 0.01">
    </a-image>

    <!-- DIREITA: camada intermédia -->
    <a-image
      src="#fragDir"
      width="1.20"
      height="1.60"
      position="0.22 0.07 0.15"
      rotation="-4 -12 5"
      material="transparent: true; opacity: 0.66; alphaTest: 0.01">
    </a-image>

    <!-- DIREITA: camada mais afastada -->
    <a-image
      src="#fragDir"
      width="0.88"
      height="1.18"
      position="0.40 0.13 0.28"
      rotation="-8 -20 9"
      material="transparent: true; opacity: 0.50; alphaTest: 0.01">
    </a-image>

  </a-entity>

</a-scene>

</body>
</html>
